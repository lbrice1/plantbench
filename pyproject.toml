[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "plantbench"
version = "0.2.1"
description = "Plantwide process simulations as test problems for process systems engineering"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    {name = "Kyle Territo"},
    {name = "Luis A. Briceno-Mena"},
    {name = "Jose A. Romagnoli"},
]
requires-python = ">=3.11"
# SciPy 1.15 is the first to take `rng` in its quasi-Monte Carlo engines, which the
# Latin hypercube of a specification uses.
dependencies = ["numpy>=2.0", "scipy>=1.15"]

[project.optional-dependencies]
# The reproduction tests run the scripts of studies/reactor_separator_recycle, which draw figures.
dev = ["pytest>=8.0", "matplotlib>=3.9", "pre-commit>=3.5", "ruff>=0.6"]
# The studies: figures, and the knowledge-discovery pipeline of studies/regimes.  None
# of it is needed by the library itself.
# hdbscan 0.8.41 is the first to run against scikit-learn 1.8 and later.
study = ["matplotlib>=3.9", "scikit-learn>=1.3", "pacmap>=0.7.6", "hdbscan>=0.8.41"]
# The documentation site: docs/conf.py, built by Read the Docs from .readthedocs.yaml.
docs = ["sphinx>=8", "myst-parser>=4", "sphinx-rtd-theme>=3", "sphinx-design>=0.6",
        "sphinx-autodoc2>=0.5"]

[project.scripts]
plantbench = "plantbench.__main__:main"

[project.urls]
Documentation = "https://plantbench.readthedocs.io"
Repository = "https://github.com/lbrice1/plantbench"

# pixi reads the extras above as features of the same names.  NumPy and SciPy come from
# conda-forge; plantbench itself is installed editable from this directory.
[tool.pixi.workspace]
channels = ["conda-forge"]
# The wheels of faiss-cpu, which PaCMAP needs, are built for macOS 14 and later on arm64;
# with pixi's default of macOS 13 the study environment would build it from source.
platforms = [{ name = "osx-arm64-macos14", platform = "osx-arm64", macos = "14.0" }, "osx-64",
             "linux-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.11"
numpy = ">=2.0"
scipy = ">=1.15"

[tool.pixi.pypi-dependencies]
plantbench = { path = ".", editable = true }

[tool.pixi.environments]
default = ["dev"]
study = ["dev", "study"]
docs = ["docs"]

[tool.pixi.tasks]
test = "pytest -q"
test-slow = "pytest -q -m slow"
lint = "ruff check ."

[tool.pixi.feature.docs.tasks]
docs = "sphinx-build -W --keep-going -b html docs docs/_build/html"

[tool.setuptools.packages.find]
include = ["plantbench*"]

# The case cards: the template's is copied by `new-case`, and `check --contribute`
# reads a case's own.
[tool.setuptools.package-data]
"*" = ["README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/_toy.py, a plant with no case behind it, is shared by the core tests; the
# repository root makes the study code under studies/ importable by its tests.
pythonpath = ["tests", "."]
# Test files in different directories may share a basename.
addopts = "--import-mode=importlib -m 'not slow'"
markers = [
    "slow: runs longer than a minute; excluded unless selected with -m slow",
]
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "figures", "cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# Kept by hand, since no formatter runs: line length, the tables aligned across lines
# (E702), imports after matplotlib.use (E402), short lambdas (E731), and the species
# index I (E741).
ignore = ["E501", "E402", "E702", "E731", "E741"]
